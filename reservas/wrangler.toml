# Servidor de reservas · Casa Campo Las Maravillas
# Etapa 1: solo desarrollo local. Nada de esto está creado todavía en la nube.
name = "reservas-casacampo"
main = "src/index.js"
compatibility_date = "2026-11-01"
workers_dev = true
preview_urls = false

# Vence los bloqueos temporales cada 5 minutos (en local se prueba con /__scheduled).
[triggers]
crons = ["*/5 * * * *"]

# Límite gratuito de consultas por persona (por IP), incluido en el plan gratuito de Workers.
# Cotizar: 20 por minuto. Bloqueos (cerrado al público por ahora): 5 por minuto.
[[ratelimits]]
name = "LIMITE_COTIZAR"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

[[ratelimits]]
name = "LIMITE_BLOQUEOS"
namespace_id = "1002"
simple = { limit = 5, period = 60 }

# Registros persistentes de cada solicitud (Workers Logs) para diagnosticar fallas aunque nadie esté mirando en vivo.
# Los registros nunca incluyen claves, tokens ni datos personales.
[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "reservas"
# Base creada en Cloudflare D1 (plan gratuito, región ENAM). El id no es secreto: sin tu cuenta no da acceso.
database_id = "a7b866ef-233e-4ba0-b89f-d89bac8b626b"
migrations_dir = "migrations"

[vars]
SITE_URL = "https://casacampolasmaravillas.github.io"
ORIGENES_PERMITIDOS = "https://casacampolasmaravillas.github.io,http://localhost:8080"
BLOQUEO_MINUTOS = "30"
# Interruptores de seguridad: los pagos online y la confirmación automática quedan APAGADOS.
PAGOS_HABILITADOS = "false"
# Crear bloqueos está cerrado al público hasta conectar la web (solo con la clave de pruebas).
BLOQUEOS_PUBLICOS = "false"
# Etapa 1: solicitudes en línea APAGADAS hasta configurar Turnstile, Telegram y Access.
SOLICITUDES_HABILITADAS = "false"
# Avisos al huésped: preparado para WhatsApp oficial en el futuro. Hoy apagado.
CANAL_HUESPED = "ninguno"
MP_MODO = "prueba"
CONFIRMACION_AUTOMATICA = "false"
# Link al panel privado que se incluye en los avisos de Telegram (protegido por Cloudflare Access).
# Turnstile: solo se aceptan verificaciones hechas en la web oficial.
TURNSTILE_HOSTNAMES = "casacampolasmaravillas.github.io"
PANEL_URL ="https://panel-casacampo.reservas-casacampo.workers.dev"

# --- Reserva automática (Fase 1). Todo APAGADO en producción hasta autorización. ---
# whatsapp = recorrido actual · solicitud = aprobación manual · instantanea = reserva y seña sin intervención
MODO_RESERVA = "whatsapp"
# ical = sin gestor de canales (NUNCA permite confirmar solo) · smoobu = gestor de canales (fase 2)
PROVEEDOR_DISPONIBILIDAD = "ical"
# Solo reservas de PRUEBA (validadas con CLAVE_PRUEBAS): usan un proveedor simulado y nunca bloquean fechas reales.
CONFIRMACION_AUTOMATICA_PRUEBAS = "true"
RETENCION_MP_MINUTOS = "30"
ORDEN_MARGEN_MIN = "5"
RETENCION_TRANSFERENCIA_HORAS = "48"
# Smoobu (fase 2): id de la casa en Smoobu, canal propio, y si ya se COMPROBÓ que una retención por API cierra Booking y Airbnb.
SMOOBU_APARTAMENTO_ID = ""
SMOOBU_CANAL_ID = "13"
SMOOBU_BLOQUEO_VERIFICADO = "false"
# Secretos de este Worker: MP_ACCESS_TOKEN, MP_WEBHOOK_SECRET, TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID, TURNSTILE_SECRET,
#   ACCESO_SECRETO (enlaces privados de los huéspedes), ICAL_URLS y AIRBNB_ICAL_URL (consulta en vivo),
#   y en la fase 2: SMOOBU_API_KEY, SMOOBU_API_SECRET, SMOOBU_WEBHOOK_TOKEN
